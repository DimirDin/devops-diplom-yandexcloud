name: deploy

# Деплой в кластер по тегу версии — требование этапа 5.
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]

env:
  IMAGE_NAME: diplom-app

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Подставить версию в статику
        run: |
          sed -i "s/__IMAGE_TAG__/${GITHUB_REF_NAME}/" static/index.html

      - name: Логин в Container Registry
        run: |
          echo '${{ secrets.YC_SA_JSON_CREDENTIALS }}' \
            | docker login --username json_key --password-stdin cr.yandex

      - name: Собрать и запушить образ с тегом версии
        env:
          REGISTRY_ID: ${{ secrets.YC_REGISTRY_ID }}
        run: |
          IMAGE="cr.yandex/$REGISTRY_ID/$IMAGE_NAME:$GITHUB_REF_NAME"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Установить yc CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh \
            | bash -s -- -a -i "$HOME/yandex-cloud"
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Получить kubeconfig
        env:
          CLUSTER_ID: ${{ secrets.YC_CLUSTER_ID }}
        run: |
          echo '${{ secrets.YC_SA_JSON_CREDENTIALS }}' > sa-key.json
          yc config profile create ci
          yc config set service-account-key sa-key.json
          yc managed-kubernetes cluster get-credentials --id "$CLUSTER_ID" --external --force
          rm -f sa-key.json

      - name: Обновить образ в кластере
        run: |
          kubectl -n app set image deployment/diplom-app nginx="$IMAGE"
          kubectl -n app rollout status deployment/diplom-app --timeout=180s
