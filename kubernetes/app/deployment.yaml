apiVersion: apps/v1
kind: Deployment
metadata:
  name: diplom-app
  namespace: app
  labels:
    app: diplom-app
spec:
  replicas: 2
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app: diplom-app

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: diplom-app
    spec:
      # emptyDir-тома создаются от root. Без fsGroup nginx под uid 101 не может
      # создать в них временные каталоги и падает при старте — проверено
      # локально. fsGroup заставляет kubelet отдать тома этой группе.
      securityContext:
        fsGroup: 101

      # Узлы прерываемые: разносим реплики по разным узлам, чтобы остановка
      # одного не унесла всё приложение целиком.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: diplom-app

      containers:
        - name: nginx
          # Тег подставляется пайплайном деплоя (kubectl set image).
          image: cr.yandex/REGISTRY_ID/diplom-app:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15

          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          # nginx пишет во временные каталоги — при readOnlyRootFilesystem
          # их нужно отдать отдельными emptyDir.
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run

      volumes:
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
